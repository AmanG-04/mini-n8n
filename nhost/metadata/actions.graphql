type Mutation {
  triggerWorkflowRun(workflow_id: uuid!): TriggerWorkflowRunOutput!
  approveStep(step_run_id: uuid!): ApproveStepOutput!
  createWebhookTrigger(workflow_id: uuid!): CreateWebhookTriggerOutput!
}

type TriggerWorkflowRunOutput {
  run_id: uuid!
  status: String!
}

type ApproveStepOutput {
  run_id: uuid!
  status: String!
}

type CreateWebhookTriggerOutput {
  trigger_id: uuid!
  secret: String!
}
