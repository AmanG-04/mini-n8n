actions:
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: "{{WORKFLOW_ACTIONS_URL}}"
      forward_client_headers: true
    permissions:
      - role: user
  - name: approveStep
    definition:
      kind: synchronous
      handler: "{{WORKFLOW_ACTIONS_URL}}"
      forward_client_headers: true
    permissions:
      - role: user
  - name: createWebhookTrigger
    definition:
      kind: synchronous
      handler: "{{WORKFLOW_ACTIONS_URL}}"
      forward_client_headers: true
    permissions:
      - role: user
custom_types:
  input_objects: []
  enums: []
  scalars: []
  objects:
    - name: TriggerWorkflowRunOutput
    - name: ApproveStepOutput
    - name: CreateWebhookTriggerOutput
